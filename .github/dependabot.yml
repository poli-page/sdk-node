version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily: a new API contract version (poli-page/api-contract) arrives as a PR at once.
      interval: daily
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
