name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # bash is available on Windows runners via Git Bash; this keeps every
    # step (including the install-smoke heredocs) portable across OSes.
    shell: bash

jobs:
  test:
    # id-token: write is for the Codecov OIDC upload in this job only.
    # contents: read is restated because a job-level block replaces the
    # workflow-level one.
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          # Windows verification on the current LTS. Catches path/EOL/shell
          # surprises without paying for a full OS × Node matrix.
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patches (patch-package)
        # .npmrc sets ignore-scripts=true to block dep install scripts, which
        # also skips our own postinstall. Run patch-package explicitly so the
        # @arethetypeswrong/core multi-chunk-gunzip patch lands before attw.
        run: npx patch-package

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API contract
        id: contract
        uses: poli-page/api-contract@0ae0dd95df8706629ddcb3a27dfda2f026154bc3 # v0.15.0-dev.1

      - name: Test (with coverage)
        run: npm run test:coverage
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}

      - name: Type tests
        # `vitest run --typecheck` runs the runtime tests too, contract included.
        run: npm run test:types
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          # OIDC auth — no CODECOV_TOKEN secret needed; requires id-token: write
          # (granted to this job) and the repo to be enrolled at codecov.io.
          use_oidc: true
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Validate published types & manifest (attw + publint)
        run: npm run lint:pack

      - name: Bundle-size budget (size-limit)
        # size-limit 13 dropped Node 20 (engines ^22.18.0 || ^24 || >=26; it
        # imports `glob` from node:fs/promises, added in Node 22). The budget
        # measures built artifact bytes, which don't vary by runtime, so skip
        # the tool on Node 20 rather than hold the dev dep back — the SDK
        # itself still supports Node >=20.18.0 and every other step proves it.
        if: matrix.node-version != 20
        run: npm run size

      - name: Verify registry signatures of installed packages
        # .npmrc's min-release-age=3 (a supply-chain guard for installs) makes
        # npm 11.6+'s audit-signatures fail with ETARGET when any installed
        # package was published in the last 3 days. Disable it just here —
        # audit signatures only queries registry metadata, no install happens.
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: 0
        run: npm audit signatures

      - name: Install smoke (ESM + CJS from packed tarball)
        # Each format also checks that `renderToFile` from `@poli-page/sdk/node`
        # throws the main entry's `PoliPageError` class: the build shares it
        # between the two entries (tsup `splitting`), and a duplicated class
        # would break `instanceof` for `io_error`. The output path sits under a
        # file, so the call fails before any request.
        run: |
          set -euo pipefail
          TARBALL="$(npm pack | tail -n 1)"
          ABS_TARBALL="$PWD/$TARBALL"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$ABS_TARBALL" >/dev/null
          echo 'not a directory' > blocker
          cat > smoke.mjs <<'EOF'
          import { PoliPage, PoliPageError } from '@poli-page/sdk';
          import { renderToFile } from '@poli-page/sdk/node';
          if (typeof PoliPage !== 'function') {
            console.error('ESM smoke FAILED: typeof PoliPage =', typeof PoliPage);
            process.exit(1);
          }
          console.log('ESM smoke OK: typeof PoliPage =', typeof PoliPage);
          const client = new PoliPage({ apiKey: 'pp_sandbox_smoke', baseUrl: 'http://127.0.0.1:9' });
          try {
            await renderToFile(client, { project: 'p', template: 't', data: {} }, 'blocker/out.pdf');
            console.error('ESM smoke FAILED: renderToFile under a file did not throw');
            process.exit(1);
          } catch (err) {
            if (!(err instanceof PoliPageError) || err.code !== 'io_error') {
              console.error('ESM smoke FAILED: renderToFile error is not an io_error PoliPageError:', err);
              process.exit(1);
            }
            console.log('ESM smoke OK: renderToFile io_error instanceof PoliPageError');
          }
          EOF
          cat > smoke.cjs <<'EOF'
          const { PoliPage, PoliPageError } = require('@poli-page/sdk');
          const { renderToFile } = require('@poli-page/sdk/node');
          if (typeof PoliPage !== 'function') {
            console.error('CJS smoke FAILED: typeof PoliPage =', typeof PoliPage);
            process.exit(1);
          }
          console.log('CJS smoke OK: typeof PoliPage =', typeof PoliPage);
          const client = new PoliPage({ apiKey: 'pp_sandbox_smoke', baseUrl: 'http://127.0.0.1:9' });
          renderToFile(client, { project: 'p', template: 't', data: {} }, 'blocker/out.pdf').then(
            () => {
              console.error('CJS smoke FAILED: renderToFile under a file did not throw');
              process.exit(1);
            },
            (err) => {
              if (!(err instanceof PoliPageError) || err.code !== 'io_error') {
                console.error('CJS smoke FAILED: renderToFile error is not an io_error PoliPageError:', err);
                process.exit(1);
              }
              console.log('CJS smoke OK: renderToFile io_error instanceof PoliPageError');
            },
          );
          EOF
          node smoke.mjs
          node smoke.cjs

  # One check that sums up the matrix: the `main` ruleset requires a check named `ci`
  # for merges, whatever the matrix legs are.
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
