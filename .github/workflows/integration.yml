name: Integration

# Runs the integration tests (tests/integration/) against the real API.
#
# Secrets:
#   POLI_PAGE_API_KEY  — a `pp_sandbox_` key of an organization whose
#                        `getting-started` project is untouched (published in
#                        `sandbox`, with its `welcome` template).
#   POLI_PAGE_BASE_URL — optional API base URL; unset, the SDK default applies.
#                        Kept a secret so the host is masked in the public logs.
#
# Without POLI_PAGE_API_KEY the job logs a skip and succeeds.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the API key secret
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          if [ -z "$POLI_PAGE_API_KEY" ]; then
            echo "::notice::POLI_PAGE_API_KEY secret is not set: skipping the integration tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Setup Node 22
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Integration tests
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the tests
          # fall back to the SDK default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          npm run test:integration
